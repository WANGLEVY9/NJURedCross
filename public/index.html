<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FCF9F5" />
    <meta name="description" content="南京大学红十字会平台：活动报名、物资借用、志愿服务与内容征集的统一入口。" />
    <title>南京大学红十字会</title>
    <link rel="stylesheet" href="/styles/boot.css" />
    <!-- 品牌字体只在活动广场加载：350KB 的子集不能参与其它页面的首屏，
         否则慢链路上会把样式与首图挤到超时。见 app/portal/events-fonts.js。 -->
    <script type="module" src="/app/portal/events-fonts.js"></script>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="modulepreload" href="/app/main.js" />
    <link rel="modulepreload" href="/app/core/api.js" />
    <link rel="modulepreload" href="/app/core/dom.js" />
    <link rel="modulepreload" href="/app/core/router.js" />
    <link rel="modulepreload" href="/app/core/motion.js" />
    <link rel="modulepreload" href="/app/ui/primitives.js" />
    <link rel="stylesheet" href="/styles/tokens.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/base.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/components.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/portal.css" media="print" data-deferred-style data-surface="portal" fetchpriority="high" />
    <link rel="stylesheet" href="/styles/admin.css" media="print" data-deferred-style data-surface="console" fetchpriority="high" />
    <link rel="stylesheet" href="/styles/date-time-picker.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/themes.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/cube.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/mobile.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/refinement.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/portal-discovery.css" media="print" data-deferred-style data-surface="portal" />
    <link rel="stylesheet" href="/styles/warmth.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/morning.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/experience.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/atmosphere.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/calendar.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/booking.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/discovery-art.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/hero-showcase.css" media="print" data-deferred-style data-surface="portal">
    <link rel="stylesheet" href="/styles/material-services.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/events-plaza.css" media="print" data-deferred-style data-surface="portal" />
    <link rel="stylesheet" href="/styles/home-experience.css" media="print" data-deferred-style data-surface="portal" />
  </head>
  <body class="njurc-starting">
    <a class="skip-link" href="#boot-screen">跳到主要内容</a>
    <div id="ambient" class="ambient" aria-hidden="true">
      <div class="ambient__mesh"></div>
      <div class="ambient__grain"></div>
      <div class="ambient__brand"></div>
    </div>
    <div id="root" class="root" data-booting="true">
      <main id="boot-screen" class="njurc-startup" aria-labelledby="boot-title" aria-busy="true" tabindex="-1">
        <header class="njurc-startup__masthead">
          <div class="njurc-startup__brand">
            <img class="njurc-startup__crest" src="/assets/nju-red-cross-emblem-128.webp" width="64" height="64" alt="南京大学红十字会会徽" fetchpriority="high" decoding="async" />
            <div class="njurc-startup__brand-copy">
              <p class="njurc-startup__brand-name">南京大学红十字会</p>
              <p class="njurc-startup__brand-en">Red Cross Society of Nanjing University</p>
            </div>
          </div>
          <p class="njurc-startup__edition"><span>校园公益服务平台</span><b>26–27</b></p>
        </header>

        <div class="njurc-startup__stage">
          <section class="njurc-startup__copy">
            <p class="njurc-startup__eyebrow">NJU RED CROSS · 服务入口</p>
            <h1 id="boot-title" class="njurc-startup__title">把善意，<br />化作行动</h1>
            <p class="njurc-startup__motto">人道 · 博爱 · 奉献</p>
            <p class="njurc-startup__tagline">从一场活动开始，连接每一份愿意付出的心。</p>
            <ul class="njurc-startup__services" aria-label="平台服务">
              <li>活动报名</li>
              <li>志愿签到</li>
              <li>运营管理</li>
            </ul>
          </section>

          <figure class="njurc-startup__media" aria-hidden="true">
            <!-- 启动屏只展示几秒：用随发布包交付的 480/960 变体，不再下载 192KB
                 原图，也不依赖服务器上的托管媒体（发布包不含托管媒体目录）。 -->
            <img src="/assets/startup/activity-02-960.webp"
                 srcset="/assets/startup/activity-02-480.webp 480w, /assets/startup/activity-02-960.webp 960w"
                 sizes="(max-width: 640px) 100vw, 720px" width="1920" height="1280" alt="" decoding="async" />
            <figcaption>
              <span>让每一份热心，都有去处</span>
              <small>活动 · 服务 · 同行</small>
            </figcaption>
          </figure>
        </div>

        <section class="njurc-startup__connection" aria-label="启动状态">
          <div class="njurc-startup__status-row">
            <span class="njurc-startup__indicator" aria-hidden="true"></span>
            <div class="njurc-startup__status-copy">
              <p class="njurc-startup__status"><span id="boot-status" role="status" aria-live="polite" aria-atomic="true">正在准备服务页面…</span></p>
              <p id="boot-note" class="njurc-startup__note" aria-live="polite" aria-atomic="true">页面就绪后，将显示可用的活动与服务。</p>
            </div>
            <button id="boot-retry" class="njurc-startup__retry" type="button" hidden>重新加载页面</button>
          </div>
          <div class="njurc-startup__progress" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <div id="overlay-root" class="overlay-root"></div>
    <div id="toast-root" class="toast-root" role="region" aria-live="polite" aria-label="通知"></div>
    <script src="/app/boot.js"></script>
    <script src="/app/main.js" type="module"></script>
  </body>
</html>
