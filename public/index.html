<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F6F8" />
    <meta name="description" content="南京大学红十字会平台：活动报名、物资借用、志愿服务与内容征集的统一入口。" />
    <title>南京大学红十字会</title>
    <link rel="stylesheet" href="/styles/boot.css" />
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="modulepreload" href="/app/main.js" />
    <link rel="modulepreload" href="/app/core/api.js" />
    <link rel="modulepreload" href="/app/core/dom.js" />
    <link rel="modulepreload" href="/app/core/router.js" />
    <link rel="modulepreload" href="/app/core/motion.js" />
    <link rel="modulepreload" href="/app/ui/primitives.js" />
    <link rel="stylesheet" href="/styles/font-faces.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/tokens.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/base.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/components.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/portal.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/admin.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/date-time-picker.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/themes.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/cube.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/mobile.css" media="print" data-deferred-style fetchpriority="high" />
    <link rel="stylesheet" href="/styles/refinement.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/portal-discovery.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/warmth.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/morning.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/experience.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/atmosphere.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/calendar.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/booking.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/discovery-art.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/hero-showcase.css" media="print" data-deferred-style>
    <link rel="stylesheet" href="/styles/material-services.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/events-plaza.css" media="print" data-deferred-style />
    <link rel="stylesheet" href="/styles/home-experience.css" media="print" data-deferred-style />
  </head>
  <body class="njurc-starting">
    <a class="skip-link" href="#boot-screen">跳到主要内容</a>
    <div id="ambient" class="ambient" aria-hidden="true">
      <div class="ambient__mesh"></div>
      <div class="ambient__grain"></div>
      <div class="ambient__brand"></div>
    </div>
    <div id="root" class="root" data-booting="true">
      <main id="boot-screen" class="njurc-startup" aria-labelledby="boot-title" tabindex="-1">
        <img class="njurc-startup__crest" src="/assets/nju-red-cross-emblem.jpg" width="100" height="100" alt="南京大学红十字会会徽" fetchpriority="high" decoding="async" />
        <p class="njurc-startup__eyebrow">NJU RED CROSS</p>
        <h1 id="boot-title" class="njurc-startup__title">南京大学红十字会</h1>
        <p class="njurc-startup__tagline">以人道为初心，让善意成为行动</p>
        <ul class="njurc-startup__services" aria-label="平台服务">
          <li>活动报名</li>
          <li>志愿签到</li>
          <li>运营管理</li>
        </ul>
        <div class="njurc-startup__connection">
          <p class="njurc-startup__status">
            <span class="njurc-startup__indicator" aria-hidden="true"></span><span id="boot-status" role="status" aria-live="polite" aria-atomic="true">正在准备服务页面</span>
          </p>
          <p id="boot-note" class="njurc-startup__note" aria-live="polite" aria-atomic="true">页面就绪后，将显示可用的活动与服务。</p>
          <button id="boot-retry" class="njurc-startup__retry" type="button" hidden>重新加载页面</button>
        </div>
      </main>
    </div>
    <div id="overlay-root" class="overlay-root"></div>
    <div id="toast-root" class="toast-root" role="region" aria-live="polite" aria-label="通知"></div>
    <script src="/app/boot.js"></script>
    <script src="/app/main.js" type="module"></script>
  </body>
</html>
