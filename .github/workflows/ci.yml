name: Project verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # 布局/像素一致性用例的标记：它们单独跑在 visual job 里，不阻断部署。
  VISUAL_TAG: '@visual'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest]
        # Windows 只跑 LTS 一组：保留平台覆盖，但不把 Node 版本矩阵再乘一遍。
        exclude:
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 26
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - name: Check modules and documentation
        run: npm run check
      - name: Check named ESM imports
        run: npm run check:links
      - name: Lint source
        run: npm run lint
      - name: Permission, identity and business regressions
        run: npm test
      # 依赖公告不受我们控制：只在 Linux + Node 24 跑一次，避免一次公告同时
      # 把六组 job 变红（结果仍会阻断发布，只是不再重复六遍）。
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
  release-tests:
    name: Release safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 scripts/package-release.py /tmp/njuredcross-release.tar.gz
      - run: npm run test:release -- /tmp/njuredcross-release.tar.gz
  browser:
    name: Browser (${{ matrix.project }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # 2026-10-30：PR 只跑受影响的用例文件（main 推送与每日全量仍跑全部）。
      - name: Select specs for this change
        id: specs
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50 || true
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/changed.txt || true
          node scripts/ci-select-specs.mjs < /tmp/changed.txt > /tmp/specs.txt || true
          if [ -s /tmp/specs.txt ]; then
            echo "args=$(tr '\n' ' ' < /tmp/specs.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Browser regressions
        run: |
          set -uo pipefail
          # 基础设施抖动（ECONNRESET、runner 排队）不应直接判红：失败重跑一次。
          for attempt in 1 2; do
            if npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --grep-invert "$VISUAL_TAG" ${{ steps.specs.outputs.args }}; then
              exit 0
            fi
            echo "::warning::browser attempt ${attempt} failed; retrying once"
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  visual:
    name: Visual layout (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 布局/亚像素一致性单独成组：差异进报告与告警，不阻断部署。
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Layout consistency
        run: npm run test:browser -- --project=desktop-chromium --project=mobile-chromium --grep "$VISUAL_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-visual-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  cross-browser:
    name: Critical flows (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    runs-on: ubuntu-24.04
    # 2026-10-28：改用 Playwright 官方镜像。此前用 `npx playwright install --with-deps`
    # 装 webkit 依赖，2026-10-27 当天 apt 源（azure.archive.ubuntu.com）只有 50-100 KB/s，
    # 140+ 个包里单个 libfluidsynth3 就下了 57 秒，整步吃掉 25-30 分钟，
    # 连续 4 次把 job 顶到超时被 cancel → Quality gate 判红 → 部署被跳过。
    # 官方镜像已内置三套浏览器与全部系统依赖，这一步不再碰 apt。
    # 版本必须与 package.json 的 @playwright/test 严格一致。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # 容器里以 root 跑，但 actions/setup-node 会把 HOME 指到 /github/home（属主 pwuser），
    # Firefox 要求 $HOME 属主是当前用户，否则一律 "Failed to launch the browser process"。
    env:
      HOME: /root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # 镜像里浏览器已就位；这里只是兜底（缺则补下，带 --with-deps 会重新跑 apt）。
      - run: npx playwright install ${{ matrix.engine }}
      - run: npm run test:browser:cross -- --project=${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.engine }}-evidence
          path: |
            playwright-cross-report/
            test-results/
          retention-days: 7
  timezones:
    name: Business timezones (${{ matrix.timezone }})
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Shanghai, America/Los_Angeles]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:node
  coverage:
    name: HTTP boundary coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require HTTP line 90, branch 80, function 90 percent
        shell: bash
        run: npm run test:coverage 2>&1 | tee coverage-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: http-coverage-evidence
          path: coverage-report.txt
          retention-days: 14
  quality:
    name: Quality gate
    needs: [verify, release-tests, browser, cross-browser, timezones, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every quality stage
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SUMMARY: ${{ github.step_summary }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, urllib.request, zipfile

          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] == 'failure'}
          cancelled = {name: job['result'] for name, job in results.items() if job['result'] == 'cancelled'}

          def job_ids():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100",
                  headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
              try:
                  data = json.load(urllib.request.urlopen(request, timeout=30))
              except Exception:
                  return {}
              return {job['name']: job['id'] for job in data.get('jobs', [])}

          def failing_tests(job_id):
              # 日志是 zip：取出失败用例名，省得每次都手动下载 job 日志。
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/jobs/{job_id}/logs",
                  headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
              try:
                  blob = urllib.request.urlopen(request, timeout=60).read()
              except Exception:
                  return []
              names = []
              with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                  for member in archive.namelist():
                      text = archive.read(member).decode('utf-8', 'ignore')
                      for line in text.splitlines():
                          stripped = line.strip()
                          if re.match(r'^\s*(✘|×)\s+\d+\s', stripped) or stripped.startswith('1) ['):
                              cleaned = re.sub(r'^\d{4}-\d{2}-\d{2}T[\d:.]+Z\s*', '', stripped)
                              if cleaned not in names:
                                  names.append(cleaned[:220])
              return names[:20]

          ids = job_ids() if (failed or cancelled) else {}
          lines = []
          if failed:
              lines.append('### 未通过的门禁')
              for name in sorted(failed):
                  lines.append(f'- **{name}**')
                  if ids.get(name):
                      for case in failing_tests(ids[name]):
                          lines.append(f'  - `{case}`')
          if cancelled:
              # 被取消不等于验证失败（历史上 webkit 曾因 apt 超时被 cancel）。
              lines.append('### 未完成验证（被取消，同样不会部署）')
              for name in sorted(cancelled):
                  lines.append(f'- {name}')
          if not failed and not cancelled:
              lines.append('全部质量阶段通过。')
          else:
              lines.append('')
              lines.append('修复后重跑失败的作业即可；无需新增提交。')
          summary = os.environ.get('SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          assert not failed and not cancelled, {'failed': failed, 'cancelled': cancelled}
          PY
  deploy:
    name: Deploy main to production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: njuredcross-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.current.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Skip superseded commits
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit will be deployed."
          fi
      - name: Package verified runtime source
        if: steps.current.outputs.deploy == 'true'
        run: python3 scripts/package-release.py /tmp/njuredcross-release.tar.gz
      - name: Deploy and verify production
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/njuredcross-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/njuredcross-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$DEPLOY_HOST" < /tmp/njuredcross-release.tar.gz | tee /tmp/deployment-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: production-deployment-receipt
          path: /tmp/deployment-result.json
          retention-days: 30
  production-smoke:
    name: Public production smoke (non-blocking)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 2026-10-30：发布成功即算成功。公网只读冒烟依赖真实链路，网络抖动不应把
    # 已经上线的发布标成失败（避免"线上是新版本但 CI 是红的"）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read-only public production smoke
        env:
          SMOKE_BASE_URL: https://njuredcross.cn
        run: npm run smoke:public
      - name: Report smoke result
        if: always()
        run: |
          {
            echo "### 公网只读冒烟（非阻塞）"
            echo "结果：${{ job.status }}。失败只告警，不影响已完成的发布；详见 production-deployment-receipt。"
          } >> "$GITHUB_STEP_SUMMARY"
