# Include in http context. No cookies, query strings, body, IP or row IDs.
map $uri $njurc_route {
    default "other";
    ~^/api/volunteer/workflow "workflow";
    ~^/api/auth/ "auth";
    ~^/api/public/ "public-api";
    ~^/api/ "other-api";
    ~^/console/ "console-page";
    ~^/(app|styles|assets)/ "static";
    / "home";
}
log_format njurc_timing escape=json
    '{"time":"$time_iso8601","route":"$njurc_route","method":"$request_method",'
    '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time","connect_seconds":"$upstream_connect_time",'
    '"protocol":"$server_protocol","connection_requests":$connection_requests}';
