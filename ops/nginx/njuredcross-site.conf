# nginx 1.24 syntax; 1.25.1+ supports the separate `http2 on` directive.
# Install timing config and start njuredcross-deploy-bridge.service before enabling this site.
#
# Reuse local nginx-to-Node connections to reduce connection setup churn.
# Public network latency and bandwidth remain separate deployment concerns.
upstream njuredcross_app {
    server 127.0.0.1:3001;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
server {
    server_name njuredcross.cn www.njuredcross.cn 47.82.5.176;
    # 单张上限 20MB + multipart 开销；页面已改为「一张一个请求」，
    # 不再需要为 12 张整包放宽到 260M（那会把 1 GiB 机器逼到 OOM）。
    client_max_body_size 25M;
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/njuredcross-timing.log njurc_timing;
    location / {
        proxy_pass http://njuredcross_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传/导出类接口要等 Box 与 SeaTable，默认 60s 会在后端仍工作时先回 504。
        # 后端内部超时（NJUBOX_UPLOAD_TIMEOUT_MS=60s）+ 排队，留到 180s。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 15s;
    }
    # 保留 http2：线上 nginx 1.24 用 listen 参数开启；1.25+ 会提示 deprecated，
    # 迁到新机器时按版本换成独立的 `http2 on;`，不要静默丢掉 HTTP/2。
    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/njuredcross.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njuredcross.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.njuredcross.cn) { return 301 https://$host$request_uri; }
    if ($host = njuredcross.cn) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name njuredcross.cn www.njuredcross.cn 47.82.5.176;
    return 404;
}
